name: krabicky

on:
  schedule:
    # NE–ČT ráno. Menu se stáhne hned a ntfy ho doručí přesně v 16:40 pražského času
    # (GitHub cron chodí i o hodiny později, proto se nespoléhá na čas běhu).
    - cron: "17 5 * * 0-4"   # hlavní běh (6:17 v zimě, 7:17 v létě)
    - cron: "23 10 * * 0-4"  # záloha, kdyby GitHub ranní běh vynechal; duplicitu pozná a nic nepošle
  workflow_dispatch:
    inputs:
      delay_min:
        description: "Test: doručit za N minut (prázdné = hned)"
        default: ""

permissions:
  contents: read

jobs:
  menu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Jídelníček na zítřek -> ntfy
        env:
          SCHEDULE: ${{ github.event.schedule }}
          DELAY_MIN: ${{ github.event.inputs.delay_min }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python krabicky/menu.py
