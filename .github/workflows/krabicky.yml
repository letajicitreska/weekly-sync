name: krabicky

on:
  schedule:
    # NE–ČT. GitHub cron chodí o hodiny později, proto tři běhy s rezervou; běh počká
    # do 16:40 pražského času a pošle okamžitou zprávu. Další běhy duplicitu poznají.
    - cron: "7 11 * * 0-4"
    - cron: "23 12 * * 0-4"
    - cron: "41 13 * * 0-4"
  workflow_dispatch:
    # Hlavní spouštění: cron-job.org v 16:40 Praha volá dispatch s mode=cron
    # (GitHub cron chodí o hodiny později nebo vůbec; zůstává jen jako záloha).
    # Ruční spuštění bez mode = test, pošle hned a vždy.
    inputs:
      mode:
        description: "cron = běh jako plánovaný (kontrola duplicity), prázdné = test"
        default: ""

concurrency:
  group: krabicky
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  menu:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # běh až ~5 h čeká na 16:40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Jídelníček na zítřek -> ntfy
        env:
          SCHEDULE: ${{ github.event.schedule || inputs.mode }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python krabicky/menu.py
